<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>집필기</title>
<meta name="theme-color" content="#2C6B65">
<script>
// 웹 주소(https)로 열었을 때만: 앱 설치 정보 + 오프라인 캐시. 로컬 파일(file://)로 열면 아무것도 안 함.
if (/^https?:$/.test(location.protocol)) {
  [['manifest', 'manifest.webmanifest'], ['icon', 'favicon-nib.png'], ['apple-touch-icon', 'apple-touch-icon-nib.png']].forEach(([rel, href]) => {
    const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l);
  });
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
<style>
:root{
  --ui:"Pretendard","Noto Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;
  --bg:#EDF1F0; --side:#E4EAE9; --paper:#FAFBFA; --ink:#1E292B; --muted:#5F7377;
  --line:#CFD9D8; --accent:#2C6B65; --accent-ink:#FFFFFF; --hover:#DAE4E2;
  --warn:#8A5700; --warn-bg:#FBF1DC; --err:#A5201A; --err-bg:#FBE7E5;
  --sel-bg:#B4DDD6; --sel-ink:#0C1A19; --on-bg:#CFE5E1;
  --ed-font:"Noto Serif KR","Nanum Myeongjo","바탕","Batang","AppleMyungjo",serif;
  --ed-size:18px; --ed-ls:0em; --ed-lh:1.9; --ed-wch:40;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#111517; --side:#171D20; --paper:#1B2225; --ink:#DCE4E3; --muted:#8FA1A4;
  --line:#2B363A; --accent:#7CC3BA; --accent-ink:#0E1517; --hover:#222C30;
  --warn:#E3B650; --warn-bg:#2E2610; --err:#F2877F; --err-bg:#3A1E1C;
  --sel-bg:#2F8F84; --sel-ink:#FFFFFF; --on-bg:#2A4642;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--hover)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08)}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=search],input[type=number],select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 10px;min-width:0}

/* gate */
.gate{min-height:100%;display:grid;place-items:center;padding:24px}
.gate-box{max-width:520px;width:100%}
.gate h1{font-size:28px;margin:0 0 12px;letter-spacing:-.02em}
.gate p{margin:0 0 20px;color:var(--muted)}
.gate-actions{display:flex;gap:10px;flex-wrap:wrap}

/* app */
.app{display:grid;grid-template-columns:310px minmax(0,1fr);height:100vh;height:100dvh}
.app.side-hidden{grid-template-columns:minmax(0,1fr)}
.app.side-hidden .side{display:none}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{display:flex;gap:8px;padding:12px 12px 8px}
.side-head select{flex:1;font-weight:600}
.search{padding:0 12px 8px;display:flex;gap:8px}
.search input{flex:1}
.search button{padding:4px 10px;font-size:13px}
.side-actions{display:flex;gap:8px;padding:0 12px 10px}
.side-actions .primary{flex:1}
.side-works{display:flex;gap:8px;padding:0 12px 8px}
.side-works button{flex:1;padding:4px 8px;font-size:13px}
.selbar{display:flex;gap:8px;padding:0 12px 10px;align-items:center;flex-wrap:wrap}
.selbar button{padding:4px 10px;font-size:13px}
button.danger{color:var(--err);border-color:var(--err)}
button.danger.fill{background:var(--err);color:#fff}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.list.selmode .item{grid-template-columns:auto minmax(0,1fr) auto;column-gap:10px}
.list.selmode .item .tags{grid-column:2/-1}
.chk{width:16px;height:16px;border:1.5px solid var(--muted);border-radius:4px;align-self:center;display:grid;place-items:center;font-size:12px;line-height:1}
.item.picked{background:var(--hover)}
.item.picked .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item.picked .chk::after{content:"✓"}
.list{flex:1;overflow:auto;margin:0;padding:4px 0;list-style:none;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;text-align:left;border:0;border-left:3px solid transparent;border-radius:0;background:none;padding:9px 14px 9px 13px;white-space:normal}
.item:hover{background:var(--hover)}
.item.on{background:var(--on-bg);color:var(--ink);border-left-color:var(--accent);border-left-width:4px;padding-left:12px}
.item.on .t{color:var(--ink)}
.item .pin{display:inline-block;width:1.3em;text-align:left;color:var(--muted);opacity:0;cursor:pointer;font-weight:400}
.item:hover .pin{opacity:.7}
.item .pin:hover{opacity:1;color:var(--accent)}
.item .pin.on{opacity:1;color:var(--accent)}
.item.pinned{border-bottom:0}
.list .pin-sep{height:0;border-top:1px dashed var(--line);margin:4px 14px}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .n{justify-self:end;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.item .m{grid-column:2;justify-self:end;color:var(--muted);font-size:11.5px;opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap}
.list.selmode .item .m{grid-column:3}
.item .tags{grid-column:1/-1;font-size:12.5px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tags span{cursor:pointer}
.item .tags span:hover{text-decoration:underline}
.list .empty{padding:18px 16px;color:var(--muted);font-size:14px}
.side-foot{border-top:1px solid var(--line);padding:10px 14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.6}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paper)}
.bar{display:flex;gap:6px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--bg);container-type:inline-size;overflow:hidden;white-space:nowrap}
.bar .pill{min-width:0;overflow:hidden;text-overflow:ellipsis}
#btnRoot{max-width:260px}
@container (max-width: 640px){#btnBackupWhere{display:none}.bar .pill-group button:first-child{border-radius:10px}#btnRoot{max-width:130px}}
@container (max-width: 470px){#btnRoot{max-width:76px}.bar{gap:3px;padding:7px 8px}.ib{width:30px}}
/* 아이폰풍: 테두리 없는 아이콘 버튼, 둥근 알약 버튼 */
.ib{width:34px;height:34px;padding:0;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:10px;color:var(--ink);flex:none}
.ib:hover{background:var(--hover)}
.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:var(--accent);color:var(--accent-ink)}
.ib.on:hover{background:var(--accent);filter:brightness(1.08)}
.ib:disabled{opacity:.3;background:transparent}
#btnPin.pinned{color:var(--accent)}
#btnSave[data-state="saved"]{color:var(--accent)}
#btnSave[data-state="dirty"]{color:var(--warn)}
#btnSave[data-state="saving"]{color:var(--warn)}
#btnSave[data-state="error"]{color:var(--err)}
#btnSave .spin{transform-origin:12px 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#btnSave .spin{animation:none}}
#btnPin.pinned polygon{fill:currentColor}
.bar .pill,.bar .pill-group button{border:0;background:var(--hover);border-radius:10px;padding:6px 12px;font-size:14px}
.bar .pill:hover,.bar .pill-group button:hover{filter:brightness(.96)}
:root[data-theme="dark"] .bar .pill:hover,:root[data-theme="dark"] .bar .pill-group button:hover{filter:brightness(1.18)}
.bar .pill-group{gap:1px}
.bar .pill-group button:first-child{border-radius:10px 0 0 10px}
.bar .pill-group button:last-child{border-radius:0 10px 10px 0;border-left:0;color:var(--muted);font-size:13px}
.spacer{flex:1}
.split{display:inline-flex}
.split button:first-child{border-radius:6px 0 0 6px}
.split button:last-child{border-radius:0 6px 6px 0;border-left:0;font-size:13px;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--line);font-size:14px}
.banner.error{background:var(--err-bg);color:var(--err)}
.banner.info{background:var(--warn-bg);color:var(--warn)}
.banner button{padding:3px 10px;font-size:13px}
.paper{flex:1;min-height:0;display:flex;padding:26px 24px 0}
.sheet{font-size:var(--ed-size);width:min(100%,calc(var(--ed-wch) * 1em));margin:0 auto;display:flex;flex-direction:column;min-height:0;min-width:0;flex:0 1 auto;position:relative}
.tw-line{position:absolute;left:0;height:0;border-top:1px solid var(--line);pointer-events:none;z-index:0}
.sheet .body{position:relative;z-index:1}
input.title{font-family:var(--ed-font);font-size:1.25em;font-weight:700;letter-spacing:var(--ed-ls);border:0;border-bottom:1px solid var(--line);background:transparent;padding:4px 0 12px;outline:0;width:100%;border-radius:0}
input.title:focus{border-bottom-color:var(--accent)}
.body{flex:1;min-height:0;resize:none;border:0;outline:0;background:transparent;font-family:var(--ed-font);font-size:1em;letter-spacing:var(--ed-ls);line-height:var(--ed-lh);padding:18px 2px 48px;caret-color:var(--accent);word-break:keep-all;overflow-wrap:anywhere}
.body::selection,.title::selection,.sample::selection{background:var(--sel-bg);color:var(--sel-ink)}
.body::-moz-selection,.title::-moz-selection{background:var(--sel-bg);color:var(--sel-ink)}
.item::selection{background:var(--sel-bg);color:var(--sel-ink)}
.emptystate{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}
.meter{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:7px 14px 7px 18px;border-top:1px solid var(--line);background:var(--bg);container-type:inline-size;overflow:hidden;white-space:nowrap}
.meter .counts{grid-column:2;display:flex;align-items:baseline;gap:28px}
.meter .right{grid-column:3;justify-self:end;display:flex;align-items:center;gap:6px}
.meter .cell{display:flex;align-items:baseline;gap:8px}
.meter .lbl{font-size:13px;color:var(--muted)}
.meter .lbl .short{display:none}
.meter b{font-size:23px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.meter .cell.sel b{font-size:17px}
.status{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
/* 창이 좁아져도 한 줄 유지 */
@container (max-width: 700px){.meter .lbl .full{display:none}.meter .lbl .short{display:inline}.meter .counts{gap:18px}.meter b{font-size:21px}}
@container (max-width: 520px){.meter{grid-template-columns:auto 1fr;gap:10px;padding-left:12px}.meter .counts{grid-column:1;gap:12px}.meter .right{grid-column:2}.meter b{font-size:19px}.meter .cell.sel b{font-size:15px}.status{font-size:13.5px}}
@container (max-width: 380px){.meter .cell.sel{display:none!important}.meter .lbl{font-size:12px}}
/* 맨 위/맨 아래 이동 버튼 */
.paper{position:relative}
.jump{position:absolute;z-index:3;bottom:20px;right:max(46px, calc(50% - var(--ed-wch) * var(--ed-size) / 2 - 54px));display:flex;flex-direction:column;gap:8px;opacity:.45;transition:opacity .15s}
.jump:hover{opacity:1}
.jb{border-radius:50%;background:var(--paper);border:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.12);color:var(--muted)}
.jb:hover{color:var(--ink)}
.status.saved{color:var(--accent)}
.status.dirty{color:var(--warn)}
.status.error{color:var(--err);font-weight:600}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;z-index:9;max-width:90vw}

dialog{border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:20px 22px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin:0 0 14px;font-size:18px}
dialog label{display:block;font-size:14px;margin-bottom:6px;color:var(--muted)}
dialog input[type=text]{width:100%}
dialog .msg{margin:0 0 12px;font-size:15px;white-space:pre-line}
dialog .hint{font-size:13px;color:var(--muted);min-height:1.2em;margin:6px 0 0}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#cfDlg{width:min(94vw,480px)}
#cfInfo{font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:100px 1fr;gap:10px 12px;align-items:center}
.form label{margin:0}
.form input,.form select{width:100%}
.bkrow{display:flex;gap:8px;align-items:center;min-width:0}
.bkrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.sample{margin:16px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:8px;font-family:var(--ed-font);font-size:var(--ed-size);letter-spacing:var(--ed-ls);line-height:var(--ed-lh);word-break:keep-all}

@media (max-width:760px){
  .app{grid-template-columns:230px minmax(0,1fr)}
  .paper{padding:16px 14px 0}
}
@media (prefers-reduced-motion:no-preference){
  .item,button{transition:background-color .12s}
}
</style>
</head>
<body>

<main id="gate" class="gate" hidden>
  <div class="gate-box">
    <h1>집필기</h1>
    <p id="gateMsg" hidden></p>
    <div class="gate-actions">
      <button id="btnResume" class="primary" hidden></button>
      <button id="btnPick" class="primary">작업 폴더 선택</button>
    </div>
  </div>
</main>

<div id="app" class="app" hidden>
  <aside class="side" id="side">
    <div class="side-head">
      <label class="sr" for="workSel">작품</label>
      <select id="workSel"></select>
      <button id="btnNewWork" title="새 작품 폴더 만들기">작품 추가</button>
    </div>
    <div class="side-works">
      <button id="btnRenameWork" title="새 이름으로 새 폴더를 만듭니다">제목 변경</button>
      <button id="btnDelWork" class="danger" title="작품 폴더를 _더미로 옮깁니다">작품 삭제</button>
    </div>
    <div class="search">
      <label class="sr" for="q">검색</label>
      <input id="q" type="search" placeholder="제목, 본문, #태그 검색" autocomplete="off">
      <button id="btnSort" title="이름순 정렬 방향 바꾸기"></button>
    </div>
    <div class="side-actions">
      <button id="btnNewDoc" class="primary">새 화</button>
      <button id="btnSelect" title="여러 화를 골라 정리합니다">선택</button>
      <button id="btnReload" title="폴더에서 다시 읽기">새로고침</button>
    </div>
    <div class="selbar" id="selbar" hidden>
      <button id="btnSelAll">전체 선택</button>
      <button id="btnSelDel" class="danger" disabled>선택 삭제</button>
      <button id="btnSelEnd">끝내기</button>
    </div>
    <ol id="list" class="list"></ol>
    <div class="side-foot" id="totals"></div>
  </aside>

  <section class="main">
    <header class="bar">
      <button id="btnSide" class="ib" title="목록 접기·펴기" aria-label="목록 접기·펴기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg></button>
      <button id="btnRoot" class="pill" title="작업 폴더 바꾸기"></button>
      <span class="split pill-group"><button id="btnBackup" title="작업 폴더 전체를 백업 폴더로 복사합니다">백업</button><button id="btnBackupWhere" title="백업 폴더 바꾸기">위치 변경</button></span>
      <div class="spacer"></div>
      <button id="btnCopyBody" class="pill" disabled title="#태그를 뺀 본문을 복사합니다">본문 복사</button>
      <button id="btnTW" class="ib" title="타자기 모드: 지금 쓰는 줄을 화면 가운데에 고정" aria-label="타자기 모드" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9V3.8h8V9"/><path d="M4 9h16"/><rect x="3.5" y="11.2" width="17" height="8.6" rx="2.2"/><path d="M7.6 14.3h.01M10.5 14.3h.01M13.5 14.3h.01M16.4 14.3h.01" stroke-width="2.2"/><path d="M9 17.3h6"/></svg></button>
      <button id="btnPin" class="ib" disabled title="이 화를 목록 맨 위에 고정" aria-label="고정" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 3.6 14.5 8.9 20.3 9.6 16 13.6 17.2 19.4 12 16.5 6.8 19.4 8 13.6 3.7 9.6 9.5 8.9"/></svg></button>
      <button id="btnSettings" class="ib" title="설정" aria-label="설정"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h9M17 6.5h3M4 12h3M11 12h9M4 17.5h11M19 17.5h1"/><circle cx="15" cy="6.5" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17.5" r="2"/></svg></button>
    </header>
    <div id="banner" class="banner" hidden role="alert"></div>

    <div id="emptyState" class="emptystate"><p id="emptyMsg">왼쪽에서 화를 고르거나 새 화를 만드세요.</p></div>

    <div id="paper" class="paper" hidden>
      <div class="jump" id="jump" hidden>
        <button type="button" class="ib jb" id="btnTop" title="맨 위로" aria-label="맨 위로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 5h11M12 9v10M7.8 13.2L12 9l4.2 4.2"/></svg></button>
        <button type="button" class="ib jb" id="btnBottom" title="맨 아래로" aria-label="맨 아래로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 19h11M12 5v10M7.8 10.8L12 15l4.2-4.2"/></svg></button>
      </div>
      <div class="sheet">
        <input id="title" class="title" type="text" placeholder="제목 (파일 이름이 됩니다)" autocomplete="off" spellcheck="false" aria-label="제목">
        <div class="tw-line" id="twLine" hidden aria-hidden="true"></div>
        <textarea id="body" class="body" spellcheck="false" aria-label="본문" placeholder="본문을 쓰세요. 어디든 #태그를 적으면 태그로 잡힙니다."></textarea>
      </div>
    </div>

    <footer class="meter" id="meter" hidden>
      <div class="counts">
        <div class="cell" title="줄바꿈과 #태그는 세지 않습니다"><span class="lbl"><span class="full">공백 포함</span><span class="short">포함</span></span><b id="cWith">0</b></div>
        <div class="cell" title="공백과 문장부호·특수문자(. , &quot; ? ! … 등)를 빼고 글자와 숫자만 셉니다 (노벨피아 기준). 줄바꿈과 #태그도 세지 않습니다."><span class="lbl"><span class="full">공백 제외</span><span class="short">제외</span></span><b id="cWithout">0</b></div>
        <div class="cell sel" id="cSelCell" hidden title="선택한 부분의 글자 수 (공백 포함 / 공백 제외)"><span class="lbl"><span class="full">선택 영역</span><span class="short">선택</span></span><b id="cSel"></b></div>
      </div>
      <div class="right">
        <div class="status" id="status" aria-live="polite"></div>

/*CORE-START*/
const Core = (() => {
  const TAG_BODY = String.raw`#([\p{L}\p{M}\p{N}_-]+)`;
  const LB = String.raw`(?<![\p{L}\p{M}\p{N}_#])`;
  const tagRe = () => new RegExp(LB + TAG_BODY, 'gu');
  const tagStripRe = () => new RegExp(String.raw`[ \t]*` + LB + TAG_BODY, 'gu');

  const norm = s => String(s).normalize('NFC').replace(/\r\n?/g, '\n');

  const SLOW = /[̀-ͯᄀ-ᇿ‍︀-️⃐-⃿゙゚\ud800-\udfff]/;
  let SEG = null;
  function gcount(s) {
    if (!s) return 0;
    if (!SLOW.test(s)) return s.length;
    if (typeof Intl !== 'undefined' && Intl.Segmenter) {
      SEG = SEG || new Intl.Segmenter(undefined, { granularity: 'grapheme' });
      let n = 0;
      for (const _ of SEG.segment(s)) n++;
      return n;
    }
    return Array.from(s).length;
  }

  function extractTags(text) {
    const t = norm(text);
    const seen = new Set();
    const out = [];
    for (const m of t.matchAll(tagRe())) {
      const key = m[1].toLowerCase();
      if (!seen.has(key)) { seen.add(key); out.push('#' + m[1]); }
    }
    return out;
  }

  // 연재 사이트에 붙여 넣을 본문: #태그를 지우고, 태그만 있던 줄은 없앤다.
  function cleanForPost(text) {
    const lines = norm(text).split('\n');
    const out = [];
    for (const line of lines) {
      const m = tagRe().exec(line);
      if (!m) { out.push(line); continue; }
      const lead = line.match(/^[ \t]*/)[0].length;
      let stripped = line.replace(tagStripRe(), '');
      if (m.index === lead) stripped = stripped.replace(/^[ \t]+/, '');
      if (stripped.trim() === '') continue;
      out.push(stripped);
    }
    return out.join('\n');
  }

  // 공백 포함: 줄바꿈만 뺀 모든 글자. 공백 제외: 모든 공백류와 줄바꿈을 뺀 글자.
  function countText(text) {
    const t = cleanForPost(text);
    // 공백 제외(노벨피아 기준): 공백·문장부호·특수기호를 빼고 글자(한글·영문 등)와 숫자만 센다
    return { withSpaces: gcount(t.replace(/\n/g, '')), noSpaces: gcount(t.replace(/[^\p{L}\p{M}\p{N}]/gu, '')) };
  }

  const MAP = { '\\': '＼', '/': '／', ':': '：', '*': '＊', '?': '？', '"': '＂', '<': '＜', '>': '＞', '|': '｜' };
  function sanitizeName(raw) {
    let s = norm(raw).replace(/[\u0000-\u001f\u007f]/g, '').replace(/[\\/:*?"<>|]/g, c => MAP[c]);
    s = s.replace(/\s+/g, ' ').trim().replace(/[. ]+$/, '');
    if (s.length > 100) s = s.slice(0, 100).replace(/[. ]+$/, '');
    if (/^(con|prn|aux|nul|com[1-9]|lpt[1-9])(\..*)?$/i.test(s)) s += '_';
    return s;
  }

  function nextTitle(prev) {
    const m = /^(\d+)(\S*)\s*/.exec((prev || '').trim());
    if (!m) return '';
    const n = String(parseInt(m[1], 10) + 1).padStart(m[1].length, '0');
    return n + m[2] + ' ';
  }

  const collator = new Intl.Collator('ko', { numeric: true, sensitivity: 'base' });
  const compare = (a, b) => collator.compare(a, b);

  function matchDoc(doc, query) {
    const q = norm(query).trim().toLowerCase();
    if (!q) return true;
    if (q[0] === '#') {
      const k = q.slice(1);
      if (!k) return doc.tags.length > 0;
      return doc.tags.some(t => t.slice(1).toLowerCase().startsWith(k));
    }
    return doc.search.includes(q);
  }

  function makeDoc(fileName, rawText, mtime, enc) {
    const text = String(rawText).replace(/\r\n?/g, '\n');
    const title = norm(fileName).replace(/\.txt$/i, ''); // 맥은 한글 파일 이름을 자모로 쪼개(NFD) 주므로 합친 글자(NFC)로 보여준다
    return {
      fileName, title, text, enc: enc || 'utf-8', mtime: mtime || 0,
      tags: extractTags(text), counts: countText(text),
      search: norm(title + '\n' + text).toLowerCase()
    };
  }

  function decodeBytes(buf) {
    try { return { text: new TextDecoder('utf-8', { fatal: true }).decode(buf), enc: 'utf-8' }; } catch (e) {}
    try { return { text: new TextDecoder('euc-kr').decode(buf), enc: 'euc-kr' }; } catch (e) {}
    return { text: new TextDecoder('utf-8').decode(buf), enc: 'utf-8-lossy' };
  }

  // 파일·폴더 이름 비교용: 맥(NFD)과 윈도우(NFC) 한글 차이, 대소문자 차이를 무시
  const nameKey = s => norm(s).toLowerCase();
  return { nameKey, norm, gcount, extractTags, cleanForPost, countText, sanitizeName, nextTitle, compare, matchDoc, makeDoc, decodeBytes };
})();
/*CORE-END*/

  ['맑은 고딕', ['맑은 고딕', 'Malgun Gothic'], 'sans-serif'], ['나눔고딕', ['나눔고딕', 'NanumGothic', 'Nanum Gothic'], 'sans-serif'],
  ['나눔바른고딕', ['나눔바른고딕', 'NanumBarunGothic'], 'sans-serif'],

  ['돋움', ['돋움', 'Dotum'], 'sans-serif'], ['굴림', ['굴림', 'Gulim'], 'sans-serif']

function buildFontOptions() {

  const values = { '': DEFAULT_STACK, serif: 'serif', 'sans-serif': 'sans-serif' };
  for (const [label, names, generic] of FONT_CANDIDATES) {

/* ---------- 저장 위치(IndexedDB에 폴더 핸들 보관) ---------- */
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('writer-store', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const KV_MEM = new Map(); // IndexedDB를 못 쓰는 환경에서도 이번 실행 동안은 기억
async function kvGet(k) {
  if (KV_MEM.has(k)) return KV_MEM.get(k);
  try {
    const db = await idbOpen();
    return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  } catch (e) { return undefined; }
}
async function kvSet(k, v) {

    const db = await idbOpen();
    await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    return true;
  } catch (e) { return false; }
}

async function ensureWrite(gesture) {
  const o = { mode: 'readwrite' };
  if ((await S.root.queryPermission(o)) === 'granted') return;
  if (gesture && (await S.root.requestPermission(o)) === 'granted') return;
  throw appErr('perm', '폴더 접근 권한이 풀렸습니다.');
}
async function fileExists(dir, name) {
  try { await dir.getFileHandle(name); return true; }
  catch (e) { if (e.name === 'NotFoundError') return false; if (e.name === 'TypeMismatchError') return true; throw e; }
}
async function writeFile(dir, name, text) {
  const fh = await dir.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  try { await w.write(text); await w.close(); }
  catch (e) { try { await w.abort(); } catch (_) {} throw e; }
}
async function copyFileTo(srcDir, name, dstDir, dstName) {
  const f = await (await srcDir.getFileHandle(name)).getFile();
  const buf = await f.arrayBuffer();
  const dst = await dstDir.getFileHandle(dstName, { create: true });
  const w = await dst.createWritable();
  try { await w.write(buf); await w.close(); } catch (e) { try { await w.abort(); } catch (_) {} throw e; }
  const g = await dst.getFile();
  if (g.size !== f.size) throw appErr('copy', `복사 검증 실패: ${name}`);
}

async function saveNow(gesture) {
  if (!S.cur) return true;
  clearTimeout(S.timer);
  if (S.conflict && S.conflict.cur === S.cur) { setStatus('conflict'); return false; }

  const title = el.title.value, body = el.body.value;
  const forced = S.force === S.cur; S.force = null;
  if (!forced && title === S.savedTitle && body === S.savedBody) return true;
  const base = S.savedBody;
  S.saving = true; setStatus('saving');
  const cur = S.cur, work = S.work;
  S.pending = (async () => {
    try {
      await ensureWrite(gesture);
      const name = Core.sanitizeName(title);
      if (!name) throw appErr('empty', '제목이 비어 있습니다. 제목을 입력하세요.');
      const oldName = cur.fileName;
      let fileName = name + '.txt';
      if (Core.nameKey(fileName) === Core.nameKey(oldName)) fileName = oldName; // 같은 파일(맥 자모 분리·대소문자 차이 포함)이면 이름 유지

      if (renaming && await fileExists(work.handle, fileName)) throw appErr('collision', `같은 이름의 화가 이미 있습니다: ${fileName}`);
      if (!forced) {
        // 다른 곳(다른 컴퓨터, 메모장 등)에서 파일이 바뀌었으면 덮어쓰지 않고 멈춘다.
        const disk = await readText(work.handle, oldName);
        if (!disk) {
          await S.root.getDirectoryHandle(work.name); // 작품 폴더 자체가 없으면 여기서 NotFoundError
          throw Object.assign(appErr('conflict', 'missing'), { info: { cur, work, disk: null } });
        }
        if (disk.text !== base && disk.text !== body) throw Object.assign(appErr('conflict', 'changed'), { info: { cur, work, disk } });
        if (disk.text !== body) await snapshotHistory(work.handle, oldName, disk.text);
      } else {
        const disk = await readText(work.handle, oldName).catch(() => null);
        if (disk && disk.text !== body) await snapshotHistory(work.handle, oldName, disk.text);
      }
      await writeFile(work.handle, fileName, body);
      let leftover = '';
      if (renaming) { try { await moveToDummy(work.handle, oldName); } catch (e) { leftover = oldName; } }
      const f = await (await work.handle.getFileHandle(fileName)).getFile();
      Object.assign(cur, Core.makeDoc(fileName, body, f.lastModified, 'utf-8'));
      S.savedTitle = title; S.savedBody = body;
      if (renaming) { if (pinSet().has(oldName)) { unpin([oldName]); const ps = pinSet(); ps.add(fileName); writePins(ps); } sortDocs(); }
      hideBanner();
      if (leftover) showBanner('info', `이전 파일 “${leftover}”을 정리하지 못했습니다. 폴더에 남아 있으니 직접 확인하세요.`, []);
      return true;
    } catch (e) {

      $('#cfInfo').textContent = `파일: ${fmt(Core.countText(info.disk.text).withSpaces)}자 (수정 ${fmtTime(info.disk.mtime)})  ·  지금 화면: ${fmt(sc)}자`;

      $('#cfInfo').textContent = `지금 화면: ${fmt(sc)}자`;

/* ---------- 선택(여러 화 정리) ---------- */
function endSelect(silent) {
  S.selMode = false; S.sel.clear();
  el.selbar.hidden = true; el.btnSelect.classList.remove('on');
  if (!silent) renderList();
}
function toggleSelect() {
  if (S.selMode) { endSelect(); return; }
  if (!S.work) return;
  S.selMode = true; S.sel.clear(); el.selbar.hidden = false; el.btnSelect.classList.add('on'); renderList();
}
function selectAllShown() {
  const shown = S.docs.filter(d => Core.matchDoc(d, S.filter));
  const all = shown.length && shown.every(d => S.sel.has(d.fileName));
  shown.forEach(d => all ? S.sel.delete(d.fileName) : S.sel.add(d.fileName));
  renderList();
}
async function deleteSelected() {
  const names = S.docs.filter(d => S.sel.has(d.fileName)).map(d => d.fileName);
  if (!names.length) return;
  const ok = await confirmBox('화 삭제', `${names.length}개 화를 삭제합니다.\n파일은 작품 폴더 안의 ${DUMMY} 폴더로 옮겨지며, 필요하면 직접 되돌릴 수 있습니다.`, '삭제', true);
  if (!ok) return;
  if (S.saving && S.pending) await S.pending;
  const curGone = S.cur && names.includes(S.cur.fileName);
  if (S.cur && !curGone && !(await flush())) return;
  const work = S.work;
  try { await ensureWrite(true); } catch (e) { showError(e, '삭제'); return; }
  const done = [], bad = [];
  for (const n of names) {
    try { await moveToDummy(work.handle, n); done.push(n); } catch (e) { bad.push(n); }
  }
  if (curGone && done.includes(S.cur.fileName)) {
    clearTimeout(S.timer); S.cur = null; S.dirty = false; S.firstDirty = 0; clearDraft();
    showEditor(false); setStatus('idle');
  }
  unpin(done);
  S.docs = S.docs.filter(d => !done.includes(d.fileName));
  S.sel = new Set(bad);
  if (!bad.length) endSelect(true);
  renderList();
  if (bad.length) showBanner('error', `${bad.length}개는 옮기지 못했습니다: ${bad.slice(0, 3).join(', ')}${bad.length > 3 ? ' 외' : ''}. 폴더가 지워졌거나 다른 프로그램이 쓰고 있을 수 있습니다.`, []);
  else toast(`${done.length}개 화를 ${DUMMY}로 옮겼습니다`);
}

/* ---------- 백업 (작업 폴더 → 백업 폴더, 덮어쓰지 않고 쌓기) ---------- */
const BKEY = 'writer.lastBackup';
const fmtDateTime = t => { const d = new Date(t); return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
async function updateBackupBtn() {
  const lb = loadJSON(BKEY);
  const h = await kvGet('backup');
  el.btnBackup.title = (h ? `백업 폴더: “${h.name}”` : '백업 폴더: 아직 안 정함 (처음 누르면 고릅니다)') + (lb ? `\n마지막 백업: ${fmtDateTime(lb.t)}` : '');
  el.btnBackupWhere.title = h ? `지금 백업 폴더: “${h.name}” · 눌러서 바꾸기` : '백업 폴더 정하기';
}
async function pickBackup() {
  try {
    const h = await window.showDirectoryPicker({ id: 'writer-backup', mode: 'readwrite' });
    if (S.root && await foldersOverlap(S.root, h)) { showBanner('error', '백업 폴더는 작업 폴더와 따로 떨어진 곳이어야 합니다. 작업 폴더 안이나 바깥 상위 폴더는 고를 수 없습니다.', []); return null; }
    await kvSet('backup', h);
    $('#bkName').textContent = h.name;
    updateBackupBtn();
    return h;
  } catch (e) { if (e && e.name !== 'AbortError') showError(e, '백업 폴더 선택'); return null; }
}
async function foldersOverlap(a, b) {
  try {
    if (await a.isSameEntry(b)) return true;
    if (a.resolve && (await a.resolve(b))) return true;
    if (b.resolve && (await b.resolve(a))) return true;
  } catch (e) {}
  return false;
}
function sameBytes(x, y) {
  if (x.byteLength !== y.byteLength) return false;
  const a = new Uint8Array(x), b = new Uint8Array(y);
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}
async function mirrorTree(src, dst, st, inDummy, path) {
  for await (const [name, h] of src.entries()) {
    if (name.startsWith('.')) continue;
    if (h.kind === 'directory') {
      let d;
      try { d = await dst.getDirectoryHandle(name, { create: true }); }
      catch (e) { st.failed.push(path + name + '/'); continue; }
      await mirrorTree(h, d, st, inDummy || name === DUMMY, path + name + '/');
      continue;
    }
    if (!/\.txt$/i.test(name)) continue;
    try {
      const buf = await (await h.getFile()).arrayBuffer();
      let old = null;
      try { old = await (await dst.getFileHandle(name)).getFile(); }
      catch (e) { if (e.name !== 'NotFoundError') throw e; }
      if (old) {
        if (sameBytes(await old.arrayBuffer(), buf)) { st.same++; continue; }
        if (inDummy) { st.same++; continue; } // 더미 파일은 시각이 붙은 이름이라 같은 이름이면 이미 백업된 것
        const dd = await dst.getDirectoryHandle(DUMMY, { create: true });
        await copyFileTo(dst, name, dd, name.replace(/\.txt$/i, '') + ` (백업 이전본 ${stampNow()}).txt`);
        st.changed++;
      } else st.added++;
      const fh = await dst.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      try { await w.write(buf); await w.close(); } catch (e) { try { await w.abort(); } catch (_) {} throw e; }
      if ((await fh.getFile()).size !== buf.byteLength) throw appErr('copy', '크기 불일치');
      st.files++;
      if (st.files % 10 === 0) el.btnBackup.textContent = `백업 중… ${st.files}`;
    } catch (e) { st.failed.push(path + name); }
  }
}
async function runBackup() {
  if (S.backingUp || !S.root) return;
  // 폴더 고르기·권한 요청은 클릭 직후에 해야 해서 저장보다 먼저 한다.
  let bh = await kvGet('backup');
  try {
    if (!bh) { bh = await pickBackup(); if (!bh) return; }
    else if ((await bh.queryPermission({ mode: 'readwrite' })) !== 'granted' && (await bh.requestPermission({ mode: 'readwrite' })) !== 'granted') { toast('백업 폴더 접근이 허용되지 않았습니다'); return; }
  } catch (e) { showError(e, '백업'); return; }
  if (await foldersOverlap(S.root, bh)) { showBanner('error', '백업 폴더가 작업 폴더와 겹칩니다. 설정에서 백업 폴더를 다른 곳으로 바꾸세요.', []); return; }
  if (S.cur && !(await flush()) && !confirm('지금 화를 저장하지 못했습니다. 저장된 내용까지만 백업할까요?')) return;
  S.backingUp = true; el.btnBackup.disabled = true; el.btnBackupWhere.disabled = true; el.btnBackup.textContent = '백업 중…';
  const st = { added: 0, changed: 0, same: 0, files: 0, failed: [] };
  try {
    await mirrorTree(S.root, bh, st, false, '');
    saveJSON(BKEY, { t: Date.now(), folder: bh.name });
    const msg = `백업 완료 → “${bh.name}”: 새 파일 ${fmt(st.added)} · 바뀐 파일 ${fmt(st.changed)}${st.changed ? ` (이전본은 백업 폴더 쪽 ${DUMMY}로)` : ''} · 그대로 ${fmt(st.same)}`;
    if (st.failed.length) showBanner('error', `${msg}. 복사 실패 ${st.failed.length}개: ${st.failed.slice(0, 3).join(', ')}${st.failed.length > 3 ? ' 외' : ''}`, []);
    else showBanner('info', msg, [{ label: '닫기', fn: hideBanner }]);
  } catch (e) { showError(e, '백업'); }
  finally { S.backingUp = false; el.btnBackup.disabled = false; el.btnBackupWhere.disabled = false; el.btnBackup.textContent = '백업'; updateBackupBtn(); }
}

/* ---------- 시작 ---------- */
function showGate(mode, handle, msg) {
  el.app.hidden = true; el.gate.hidden = false; el.btnResume.hidden = true;
  const text = msg || (mode === 'unsupported' ? '이 브라우저는 폴더에 직접 저장하는 기능을 지원하지 않습니다. 크롬이나 엣지에서 이 파일을 여세요.' : '');
  el.gateMsg.textContent = text; el.gateMsg.hidden = !text;
  el.btnPick.hidden = mode === 'unsupported';
  if (mode === 'resume' && handle) {
    el.btnResume.hidden = false; el.btnResume.textContent = `“${handle.name}” 폴더 이어서 열기`;
    el.btnResume.onclick = async () => {
      try { if ((await handle.requestPermission({ mode: 'readwrite' })) === 'granted') await enterRoot(handle, false); else showGate('resume', handle, '접근이 허용되지 않았습니다.'); }
      catch (e) { showGate('resume', handle, `열지 못했습니다: ${describeError(e).msg}`); }
    };
  }
}
async function pickFolder() {
  try {
    const h = await window.showDirectoryPicker({ id: 'writer-root', mode: 'readwrite' });
    await kvSet('root', h);
    await enterRoot(h, true);
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    showGate('pick', null, `폴더를 열지 못했습니다: ${describeError(e).msg}`);
  }
}
// 쓰는 도중에 작업 폴더 바꾸기: 먼저 폴더를 고른 뒤(클릭 직후여야 함) 지금 내용을 저장하고 넘어간다.
async function changeRoot() {
  let h;
  try { h = await window.showDirectoryPicker({ id: 'writer-root', mode: 'readwrite' }); }
  catch (e) { if (e && e.name !== 'AbortError') showError(e, '폴더 열기'); return; }
  if (S.root && (await S.root.isSameEntry(h).catch(() => false))) { toast('이미 이 폴더입니다'); return; }
  if (S.cur && !(await flush()) && !confirm('지금 화를 저장하지 못했습니다. 그래도 작업 폴더를 바꿀까요?')) return;
  const prev = S.root;
  if (await enterRoot(h, true, prev)) await kvSet('root', h);
}
async function enterRoot(h, fresh, prev) {
  const before = S.root; S.root = h;
  try { await listWorks(); }
  catch (e) {
    S.root = before;
    if (prev) { showError(e, '작업 폴더 열기'); return false; }
    showGate('pick', null, `폴더를 읽지 못했습니다: ${describeError(e).msg}`); return false;
  }
  el.gate.hidden = true; el.app.hidden = false;
  applyCfg();
  if (fresh) { S.cur = null; S.work = null; S.dirty = false; clearTimeout(S.timer); clearDraft(); hideBanner(); }
  const last = fresh ? {} : (loadJSON('writer.last') || {});
  const w = S.works.find(x => last.work && Core.nameKey(x.name) === Core.nameKey(last.work)) || S.works[0] || null;
  await selectWork(w, w && last.work === w.name ? last.file : null);
  if (!w) showEditor(false);
  renderWorks();
  return true;
}

/* ---------- 이벤트 ---------- */
function wire() {
  el.btnPick.onclick = pickFolder;
  el.btnNewWork.onclick = newWork;
  el.btnNewDoc.onclick = newDoc;
  el.btnReload.onclick = refreshAll;
  el.btnRenameWork.onclick = renameWork;
  el.btnDelWork.onclick = deleteWork;
  el.btnSelect.onclick = toggleSelect;
  el.btnSelAll.onclick = selectAllShown;
  el.btnSelDel.onclick = deleteSelected;
  el.btnSelEnd.onclick = () => endSelect();
  el.btnRoot.onclick = changeRoot;
  el.btnTW.onclick = twToggle;
  el.btnTop.onclick = () => jumpTo(false);
  el.btnBottom.onclick = () => jumpTo(true);
  [el.btnTop, el.btnBottom].forEach(bt => bt.addEventListener('mousedown', e => e.preventDefault())); // 누를 때 본문 포커스를 뺏지 않게
  el.body.addEventListener('input', twSchedule);
  el.body.addEventListener('keyup', e => { if (/^(Arrow|Page|Home|End|Enter|Backspace|Delete)/.test(e.key)) twSchedule(); });
  const onScrollbar = e => { const b = el.body, r = b.getBoundingClientRect(); return e.clientX >= r.left + Math.min(b.clientWidth, b.offsetWidth - 16); }; // 맥처럼 글 위에 겹쳐 뜨는 스크롤바(폭 0)도 오른쪽 16px을 스크롤바로 본다
  TW.onScrollbar = onScrollbar;
  el.body.addEventListener('mouseup', e => { if (!onScrollbar(e)) twSchedule(); }); // 스크롤바를 놓는 건 클릭이 아님
  el.body.addEventListener('scroll', () => {
    if (!cfg.typewriter || !S.cur) return;
    clearTimeout(TW.scrollT); TW.scrollT = setTimeout(twScrollEnd, 150);
  });
  document.addEventListener('mousedown', e => { TW.mouseDown = true; TW.downOnBar = e.target === el.body && onScrollbar(e); }, true);
  window.addEventListener('mouseup', e => {
    const was = TW.mouseDown; TW.mouseDown = false; TW.downOnBar = false;
    // 스크롤바 구역(맥 오버레이 포함)의 빈 공간: 끌지 않고 그냥 클릭했으면 그때 커서를 글 끝/처음으로
    const p = TW.pendingBlank; TW.pendingBlank = null;
    if (p && cfg.typewriter && S.cur && Math.hypot(e.clientX - p.x, e.clientY - p.y) < 4) {
      const b = el.body; b.focus({ preventScroll: true }); b.setSelectionRange(p.to, p.to);
      TW.lastBlankClick = p.to; updateSelection(); twCenter();
    }
    if (was && cfg.typewriter) { clearTimeout(TW.scrollT); TW.scrollT = setTimeout(twScrollEnd, 60); }
  }, true);
  el.body.addEventListener('compositionstart', () => { TW.composing = true; });
  el.body.addEventListener('compositionend', () => { TW.composing = false; });
  // 타자기 모드의 위·아래 빈 공간을 클릭하면 브라우저마다 커서가 엉뚱한 곳(맨 앞)으로 가므로 직접 처리한다
  el.body.addEventListener('mousedown', e => {
    if (!cfg.typewriter || e.button !== 0 || e.shiftKey) return;
    const b = el.body, r = b.getBoundingClientRect(), cs = getComputedStyle(b);
    const pt = parseFloat(cs.paddingTop) || 0, pb = parseFloat(cs.paddingBottom) || 0;
    const textTop = r.top + pt - b.scrollTop;
    const textBottom = textTop + (b.scrollHeight - pt - pb);
    let to = -1;
    if (e.clientY > textBottom) to = b.value.length;
    else if (e.clientY < textTop) to = 0;
    if (to < 0) return;
    // 스크롤바 구역이면 끌기를 막지 않고, 놓을 때(끌지 않았으면) 처리한다
    if (TW.onScrollbar && TW.onScrollbar(e)) { TW.pendingBlank = { to, x: e.clientX, y: e.clientY }; return; }
    e.preventDefault();
    TW.lastBlankClick = to;
    b.focus({ preventScroll: true }); b.setSelectionRange(to, to);
    updateSelection(); twSchedule();
  });
  el.body.addEventListener('focus', () => { if (!TW.downOnBar) twSchedule(); }); // 스크롤바 클릭으로 포커스가 와도 되돌아가지 않게
  window.addEventListener('resize', () => { twLayout(); twSchedule(); updateJump(); });
  el.btnBackup.onclick = runBackup;
  $('#bkChange').onclick = () => pickBackup();
  el.btnBackupWhere.onclick = async () => { if (S.backingUp) return; const h = await pickBackup(); if (h) toast(`백업 폴더를 “${h.name}”(으)로 정했습니다. 다음 백업부터 여기에 쌓입니다`); };
  el.btnPin.onclick = () => { if (S.cur) togglePin(S.cur.fileName); };
  el.btnSort.onclick = () => { cfg.sortDesc = !cfg.sortDesc; saveCfg(); renderList(); };
  el.workSel.onchange = () => { const w = S.works[parseInt(el.workSel.value, 10)]; if (w && (!S.work || w.name !== S.work.name)) selectWork(w, null); else renderWorks(); };
  el.q.oninput = () => { S.filter = el.q.value; renderList(); };
  el.list.onclick = e => {
    const tag = e.target.closest('[data-tag]');
    if (tag) { e.stopPropagation(); el.q.value = tag.dataset.tag; S.filter = tag.dataset.tag; renderList(); return; }
    const pn = e.target.closest('[data-pin]');
    if (pn) { e.stopPropagation(); const dd = S.docs[parseInt(pn.closest('.item').dataset.i, 10)]; if (dd) togglePin(dd.fileName); return; }
    const b = e.target.closest('.item'); if (!b) return;
    const d = S.docs[parseInt(b.dataset.i, 10)]; if (!d) return;
    if (S.selMode) { if (S.sel.has(d.fileName)) S.sel.delete(d.fileName); else S.sel.add(d.fileName); renderList(); return; }
    openDoc(d);
  };
  el.btnSide.onclick = () => { cfg.sideOpen = !cfg.sideOpen; saveCfg(); el.app.classList.toggle('side-hidden', !cfg.sideOpen); twLayout(); twSchedule(); };
  el.title.addEventListener('input', onEdit);
  el.body.addEventListener('input', e => { unTrack(e); onEdit(); updateSelection(); });
  // 되돌리기 키: Ctrl/Cmd+Z, 다시 실행: Ctrl/Cmd+Shift+Z, Ctrl+Y
  el.body.addEventListener('keydown', e => {
    if (e.isComposing || e.altKey) return;
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.code === 'KeyZ') { e.preventDefault(); if (e.shiftKey) unRedo(); else unUndo(); return; }
    if (e.ctrlKey && !e.metaKey && e.code === 'KeyY') { e.preventDefault(); unRedo(); return; }
    if (/^(Arrow|Page|Home|End)/.test(e.key)) UN.force = true; // 커서를 옮기면 다음 입력은 새 묶음
  });
  // 메뉴(우클릭·편집 메뉴)의 실행 취소도 같은 방식으로
  el.body.addEventListener('beforeinput', e => {
    if (e.inputType === 'historyUndo') { e.preventDefault(); unUndo(); }
    else if (e.inputType === 'historyRedo') { e.preventDefault(); unRedo(); }
  });
  el.body.addEventListener('compositionstart', () => { UN.composeStart = true; });
  el.body.addEventListener('mousedown', () => { UN.force = true; });
  ['keyup', 'mouseup', 'select'].forEach(ev => el.body.addEventListener(ev, unSyncCaret));
  ['select', 'keyup', 'mouseup', 'focus'].forEach(ev => el.body.addEventListener(ev, updateSelection));
  el.title.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); el.body.focus(); } });
  el.title.addEventListener('blur', () => {
    const s = Core.sanitizeName(el.title.value);
    if (s && s !== el.title.value) { el.title.value = s; onEdit(); }
  });
  el.btnSave.onclick = () => saveNow(true);
  el.btnCopyBody.onclick = async () => { toast((await copyText(Core.cleanForPost(el.body.value))) ? '본문을 복사했습니다 (#태그 제외)' : '복사하지 못했습니다'); };
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.code === 'KeyS' || e.key.toLowerCase() === 's')) { e.preventDefault(); saveNow(true); } // 한글 입력 중이면 key가 'ㄴ'으로 올 수 있어 물리 키(KeyS)도 본다
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(false); else checkExternal(); });
  window.addEventListener('focus', () => { checkExternal(); });
  window.addEventListener('pagehide', () => { saveNow(false); });
  window.addEventListener('blur', () => { if (S.dirty) saveNow(false); });
  window.addEventListener('beforeunload', e => { if (S.dirty || S.saving) { e.preventDefault(); e.returnValue = ''; } });

  // 설정
  $('#btnSettings').onclick = () => {
    $('#fontSel').value = cfg.font; $('#fontCustom').value = cfg.custom; $('#sizeIn').value = cfg.size; $('#lsIn').value = cfg.ls;
    $('#lhIn').value = cfg.lh; $('#wIn').value = cfg.wch; $('#themeSel').value = cfg.theme; $('#setDlg').showModal();
    kvGet('backup').then(h => { $('#bkName').textContent = h ? h.name : '지정 안 됨'; });
  };
  $('#setClose').onclick = () => $('#setDlg').close();
  const bind = (id, fn) => $(id).addEventListener('input', () => { fn($(id).value); saveCfg(); applyCfg(); });
  bind('#fontSel', v => { cfg.font = v; cfg.custom = ''; $('#fontCustom').value = ''; });
  bind('#fontCustom', v => { cfg.custom = v; });
  bind('#sizeIn', v => { cfg.size = num(v, cfg.size, 12, 40); });
  bind('#lsIn', v => { cfg.ls = num(v, cfg.ls, -0.1, 0.5); });
  bind('#lhIn', v => { cfg.lh = num(v, cfg.lh, 1.2, 3); });
  bind('#wIn', v => { cfg.wch = num(v, cfg.wch, 20, 80); });
  bind('#themeSel', v => { cfg.theme = v; });
  if (window.matchMedia) { const mq = matchMedia('(prefers-color-scheme: dark)'); (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : () => {})(applyTheme); }
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove(); return ok;
  }
}

async function boot() {
  buildFontOptions(); applyCfg(); wire(); updateBackupBtn();
  if (!window.showDirectoryPicker) { showGate('unsupported'); return; }
  const h = await kvGet('root');
  if (h) {
    let perm = 'prompt';
    try { perm = await h.queryPermission({ mode: 'readwrite' }); } catch (e) {}
    if (perm === 'granted') { await enterRoot(h, false); return; }
    showGate('resume', h); return;
  }
  showGate('pick');
}
window.__writer = { TW, twCaretY, twToggle, runBackup, checkExternal, cfg, S, Core, saveNow, openDoc, newDoc, selectWork, deleteWork, renameWork, deleteSelected, refreshAll, changeRoot };
boot();
})();
</script>
</body>
</html>
